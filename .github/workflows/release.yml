name: Release WordPress Plugin ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify plugin entry file
        run: |
          if [ ! -f "arcos-static-sites.php" ]; then
            echo "Missing arcos-static-sites.php in repository root"
            exit 1
          fi

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p dist/arcos-static-sites
          cp -R arcos-static-sites.php readme.txt dist/arcos-static-sites/
          cd dist
          zip -r ../arcos-static-sites.zip arcos-static-sites \
            -x "*/.DS_Store" "*/__MACOSX/*" "*/.git/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: arcos-static-sites.zip
          generate_release_notes: true
